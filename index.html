<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Võ Minh Hoàng | Data Science Portfolio</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Portfolio của Võ Minh Hoàng - Sinh viên chuyên ngành Khoa học Dữ liệu (Data Science) tại ĐH Nguyễn Tất Thành. Định hướng Data Analyst / Data Scientist.">
    <meta name="keywords" content="Võ Minh Hoàng, Khoa học Dữ liệu, Data Science, Data Analyst, Machine Learning, Power BI, Python, Portfolio">
    <meta name="author" content="Võ Minh Hoàng">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Võ Minh Hoàng | Data Science Portfolio">
    <meta property="og:description" content="Portfolio chuyên ngành Khoa học Dữ liệu: Machine Learning, BI Dashboard, Mobile & Web Engineering.">
    <meta property="og:image" content="assets/images/avatar.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css?v=20260910_07">
</head>
<body>

    <!-- HIỆU ỨNG KHINH KHÍ CẦU (LIGHT THEME) -->
    <div class="balloon-scene" aria-hidden="true">
        <span class="balloon balloon-blue balloon-left-1"></span>
        <span class="balloon balloon-pink balloon-left-2"></span>
        <span class="balloon balloon-yellow balloon-left-3"></span>
        <span class="balloon balloon-purple balloon-left-4"></span>
        <span class="balloon balloon-mint balloon-right-1"></span>
        <span class="balloon balloon-peach balloon-right-2"></span>
        <span class="balloon balloon-blue balloon-right-3"></span>
        <span class="balloon balloon-purple balloon-right-4"></span>
        <span class="balloon balloon-pink balloon-left-5"></span>
        <span class="balloon balloon-yellow balloon-left-6"></span>
        <span class="balloon balloon-peach balloon-right-5"></span>
        <span class="balloon balloon-pink balloon-right-6"></span>
    </div>

    <!-- HIỆU ỨNG BẦU TRỜI SAO (DARK THEME) -->
    <div class="star-scene" aria-hidden="true">
        <span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span>
        <span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span>
        <span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span>
        <span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span>
        <span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span>
    </div>

    <!-- 1. CỤM NÚT ĐỔI NGÔN NGỮ & SÁNG/TỐI Ở GÓC TRÊN CÙNG -->
    <nav class="top-nav-bar" aria-label="Thanh công cụ chuyển đổi">
        <div class="nav-switches">
            <button class="nav-action-btn btn-lang" id="langToggle" type="button" aria-label="Chuyển đổi ngôn ngữ Tiếng Việt / English">
                <i class="fa-solid fa-globe" aria-hidden="true"></i> <span id="langText">EN</span>
            </button>
            <button class="nav-action-btn btn-theme" id="themeToggle" type="button" aria-label="Chuyển đổi giao diện Sáng / Tối">
                <i class="fa-solid fa-moon" id="themeIcon" aria-hidden="true"></i>
            </button>
        </div>
    </nav>

    <!-- THÔNG BÁO POPUP SAO CHÉP -->
    <div id="copyToast" class="toast-popup" role="status" aria-live="polite">
        <i class="fa-solid fa-circle-check" aria-hidden="true"></i> <span id="toastMsg" data-i18n="toast-copied">Đã sao chép vào bộ nhớ tạm!</span>
    </div>

    <!-- NỘI DUNG CHÍNH PORTFOLIO -->
    <div class="portfolio-container">

        <!-- ======================= 2. HERO PROFILE CĂN GIỮA (PURE UI SHELL) ======================= -->
        <header class="glass-card hero-center-card scroll-reveal">
            <div class="hero-avatar-area">
                <div class="avatar-orbit">
                    <img src="assets/images/avatar.jpg" alt="Chân dung Võ Minh Hoàng" id="hero-avatar" class="avatar-img" width="120" height="120">
                </div>
                <h1 class="hero-name" id="hero-name" data-i18n="name"></h1>
                <p class="hero-role" id="hero-title" data-i18n="role"></p>
                <div class="status-badge">
                    <span class="beacon-dot" aria-hidden="true"></span>
                    <span id="hero-status" data-i18n="status"></span>
                </div>

                <!-- NÚT TẢI CV & LIÊN KẾT NHANH -->
                <div class="hero-actions" style="display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 14px; flex-wrap: wrap;">
                    <a href="#" id="hero-cv-btn" class="hero-action-btn" style="display: inline-flex; align-items: center; gap: 7px; padding: 7px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; background: linear-gradient(135deg, #0284c7, #7c3aed); color: #fff; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3); transition: var(--transition-smooth); cursor: pointer;" title="Tải xuống hoặc xem CV bản PDF">
                        <i class="fa-solid fa-file-arrow-down"></i>
                        <span data-i18n="btn-download-cv">Tải CV (PDF)</span>
                    </a>
                    <a href="https://github.com/" target="_blank" rel="noopener noreferrer" id="hero-github-link" class="hero-action-btn" style="display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; background: rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.1); color: var(--card-text); transition: var(--transition-smooth);" title="Xem GitHub">
                        <i class="fa-brands fa-github"></i>
                        <span>GitHub</span>
                    </a>
                    <a href="https://linkedin.com/" target="_blank" rel="noopener noreferrer" id="hero-linkedin-link" class="hero-action-btn" style="display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; background: rgba(2,132,199,0.1); border: 1px solid rgba(2,132,199,0.25); color: var(--primary-blue); transition: var(--transition-smooth);" title="Xem LinkedIn">
                        <i class="fa-brands fa-linkedin"></i>
                        <span>LinkedIn</span>
                    </a>
                </div>
            </div>

            <!-- THANH LIÊN HỆ & SAO CHÉP -->
            <div class="contact-ribbon" role="region" aria-label="Thông tin liên hệ">
                <div class="contact-chip chip-zalo copy-trigger" id="hero-phone-chip" data-copy="" role="button" tabindex="0" title="Bấm để sao chép số Zalo">
                    <div class="chip-icon" aria-hidden="true"><i class="fa-solid fa-comment-dots"></i></div>
                    <div class="chip-text">
                        <small data-i18n="lbl-zalo">ZALO</small>
                        <strong id="hero-phone"></strong>
                    </div>
                    <span class="copy-hint-icon" aria-hidden="true"><i class="fa-regular fa-copy"></i></span>
                </div>

                <div class="contact-chip copy-trigger" id="hero-email-chip" data-copy="" role="button" tabindex="0" title="Bấm để sao chép Email">
                    <div class="chip-icon" aria-hidden="true"><i class="fa-solid fa-envelope"></i></div>
                    <div class="chip-text">
                        <small data-i18n="lbl-email">EMAIL</small>
                        <strong id="hero-email"></strong>
                    </div>
                    <span class="copy-hint-icon" aria-hidden="true"><i class="fa-regular fa-copy"></i></span>
                </div>

                <div class="contact-chip">
                    <div class="chip-icon" aria-hidden="true"><i class="fa-solid fa-cake-candles"></i></div>
                    <div class="chip-text">
                        <small data-i18n="lbl-dob">NGÀY SINH</small>
                        <strong id="hero-dob" data-i18n="val-dob"></strong>
                    </div>
                </div>

                <div class="contact-chip">
                    <div class="chip-icon" aria-hidden="true"><i class="fa-solid fa-location-dot"></i></div>
                    <div class="chip-text">
                        <small data-i18n="lbl-loc">ĐỊA CHỈ</small>
                        <strong id="hero-loc" data-i18n="val-loc"></strong>
                    </div>
                </div>
            </div>
        </header>

        <!-- ĐƯỜNG BAY MÁY BAY GIẤY -->
        <div class="paper-plane-divider" aria-hidden="true">
            <i class="fa-regular fa-paper-plane"></i>
            <span class="flight-path"></span>
        </div>

        <!-- ======================= 3. BỐ CỤC BENTO MATRIX (PURE UI SHELL) ======================= -->
        <main class="bento-matrix">

            <!-- MỤC TIÊU NGHỀ NGHIỆP -->
            <section class="glass-card about-section bento-col-8 scroll-reveal" aria-labelledby="about-heading">
                <div class="card-title-row">
                    <span class="badge-flare flare-pastel-blue" aria-hidden="true"><i class="fa-solid fa-compass"></i></span>
                    <h2 id="about-heading" data-i18n="title-about">Mục tiêu nghề nghiệp</h2>
                </div>
                <p class="narrative-body" id="hero-bio" data-i18n="desc-about">
                    <span class="skeleton-line" style="display: block; width: 100%;"></span>
                    <span class="skeleton-line" style="display: block; width: 92%;"></span>
                    <span class="skeleton-line" style="display: block; width: 78%;"></span>
                </p>
            </section>

            <!-- HỌC VẤN -->
            <section class="glass-card education-section bento-col-4 scroll-reveal" aria-labelledby="edu-heading">
                <div class="card-title-row">
                    <span class="badge-flare flare-pastel-purple" aria-hidden="true"><i class="fa-solid fa-graduation-cap"></i></span>
                    <h2 id="edu-heading" data-i18n="title-edu">Học vấn và Bằng cấp</h2>
                </div>
                <div class="edu-card-content" id="education-container">
                    <div class="skeleton-line" style="width: 75%; height: 18px;"></div>
                    <div class="skeleton-line" style="width: 50%;"></div>
                    <div class="skeleton-line" style="width: 90%;"></div>
                </div>
            </section>

            <!-- DỰ ÁN NỔI BẬT -->
            <section class="glass-card projects-section bento-col-12 scroll-reveal" aria-labelledby="projects-heading">
                <div class="card-title-row">
                    <span class="badge-flare flare-pastel-mint" aria-hidden="true"><i class="fa-solid fa-cubes-stacked"></i></span>
                    <h2 id="projects-heading" data-i18n="title-projects">Dự án nổi bật và Kinh nghiệm thực hành</h2>
                </div>

                <div class="project-matrix" id="projects-container">
                    <div class="skeleton-line" style="height: 120px; border-radius: 16px;"></div>
                    <div class="skeleton-line" style="height: 120px; border-radius: 16px;"></div>
                </div>
            </section>

            <!-- KỸ NĂNG: LẬP TRÌNH VÀ CSDL -->
            <section class="glass-card programming-section bento-col-6 scroll-reveal" aria-labelledby="code-heading">
                <div class="card-title-row">
                    <span class="badge-flare flare-pastel-blue" aria-hidden="true"><i class="fa-solid fa-code"></i></span>
                    <h2 id="code-heading" data-i18n="sub-code">Lập trình và CSDL</h2>
                </div>
                <div class="tile-chips" id="skills-programming-chips">
                    <span class="skeleton-line" style="width: 80px; height: 28px; display: inline-block; border-radius: 10px; margin: 4px;"></span>
                    <span class="skeleton-line" style="width: 70px; height: 28px; display: inline-block; border-radius: 10px; margin: 4px;"></span>
                    <span class="skeleton-line" style="width: 90px; height: 28px; display: inline-block; border-radius: 10px; margin: 4px;"></span>
                </div>
            </section>

            <!-- KỸ NĂNG: THƯ VIỆN VÀ CÔNG CỤ -->
            <section class="glass-card library-section bento-col-6 scroll-reveal" aria-labelledby="tools-heading">
                <div class="card-title-row">
                    <span class="badge-flare flare-pastel-purple" aria-hidden="true"><i class="fa-solid fa-chart-pie"></i></span>
                    <h2 id="tools-heading" data-i18n="sub-tools">Thư viện và Công cụ Dữ liệu</h2>
                </div>
                <div class="tile-chips" id="skills-tools-chips">
                    <span class="skeleton-line" style="width: 80px; height: 28px; display: inline-block; border-radius: 10px; margin: 4px;"></span>
                    <span class="skeleton-line" style="width: 100px; height: 28px; display: inline-block; border-radius: 10px; margin: 4px;"></span>
                    <span class="skeleton-line" style="width: 75px; height: 28px; display: inline-block; border-radius: 10px; margin: 4px;"></span>
                </div>
            </section>

            <!-- TƯ DUY NGHỀ NGHIỆP & KỸ NĂNG MỀM -->
            <section class="glass-card mindset-section bento-col-12 scroll-reveal" aria-labelledby="mindset-heading">
                <div class="card-title-row">
                    <span class="badge-flare flare-pastel-mint" aria-hidden="true"><i class="fa-solid fa-lightbulb"></i></span>
                    <h2 id="mindset-heading" data-i18n="tag-mindset">Kỹ năng tư duy và Năng lực bổ trợ</h2>
                </div>

                <div class="mindset-matrix" id="mindset-container">
                    <div class="skeleton-line" style="height: 64px; border-radius: 14px;"></div>
                    <div class="skeleton-line" style="height: 64px; border-radius: 14px;"></div>
                </div>
            </section>

        </main>
    </div>

    <!-- 4. CHÂN TRANG (FOOTER) -->
    <footer class="page-footer" role="contentinfo">
        <div class="footer-dashed-line" aria-hidden="true"></div>
        <p class="footer-copy" data-i18n="footer-copy">© 2026 Võ Minh Hoàng · Data Science Portfolio</p>
    </footer>

    <!-- Scripts -->
    <script src="js/translations.js?v=20260910_07"></script>
    <script type="module" src="js/main.js?v=20260910_07"></script>
    <!-- Nhúng Firebase Config Module -->
    <script type="module" src="./js/modules/firebase-config.js?v=20260910_07"></script>
    <!-- Module Dịch vụ Cào & Render Dữ liệu từ Firestore -->
    <script type="module" src="./js/data-service.js?v=20260910_07"></script>
</body>
</html>
